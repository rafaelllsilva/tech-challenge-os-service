spring.application.name=os-service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=os

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.schemas=os
spring.flyway.default-schema=os

# Mensageria (LocalStack do docker-compose-test.yaml)
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.sns.endpoint=http://localhost:4567
spring.cloud.aws.sqs.endpoint=http://localhost:4567
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
os.mensageria.topicos.os-events=os-events
os.mensageria.topicos.billing-events=billing-events
os.mensageria.topicos.execution-events=execution-events
os.mensageria.filas.billing=os-service-billing-events
os.mensageria.filas.execution=os-service-execution-events
os.outbox.relay.intervalo-ms=500

# Configuração Docker Compose
spring.docker.compose.skip.in-tests=false
spring.docker.compose.file=src/test/resources/docker-compose-test.yaml
spring.docker.compose.lifecycle-management=start_and_stop
spring.docker.compose.start.arguments[0]=--force-recreate
spring.docker.compose.stop.command=down
spring.docker.compose.stop.arguments[0]=--volumes
spring.docker.compose.stop.arguments[1]=--remove-orphans

#spring.security.user.name=admin
#spring.security.user.password=admin

# Configuração JWT
jwt.secret=jwt-test-secret-key-for-unit-tests-only-minimum-32-chars
jwt.access-token-expiration=3600

# Configuração Webhook
webhook.aprovacao-cliente.secret=webhook-secret-key-123
