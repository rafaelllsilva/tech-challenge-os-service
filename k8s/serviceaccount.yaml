apiVersion: v1
kind: ServiceAccount
metadata:
  name: os-service
  namespace: os-service
  # AWS Academy: não há IRSA (sem provider OIDC e sem permissão para criar roles), então não há
  # annotation eks.amazonaws.com/role-arn. O SDK usa as credenciais da role do nó (LabRole), que
  # precisa de sns:Publish em os-events e de sqs:ReceiveMessage/DeleteMessage/GetQueueAttributes/
  # GetQueueUrl/ChangeMessageVisibility nas filas os-service-*-events.
