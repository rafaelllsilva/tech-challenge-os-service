apiVersion: v1
kind: ServiceAccount
metadata:
  name: os-service
  namespace: tech-challenge
  annotations:
    # IRSA: role IAM com infra/aws/politica-iam-os-service.json. AWS_ACCOUNT_ID_PLACEHOLDER é
    # substituído pelo deploy.yml.
    # AWS Academy (LabRole, sem IRSA/OIDC): a annotation não tem efeito, e o SDK usa as credenciais
    # da role do nó (cadeia padrão de credenciais). Nesse caso a LabRole precisa das permissões
    # da política acima.
    eks.amazonaws.com/role-arn: "arn:aws:iam::AWS_ACCOUNT_ID_PLACEHOLDER:role/os-service-irsa"
