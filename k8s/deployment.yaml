apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  namespace: os-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Replace one Pod at a time so the new pool does not overlap old pools.
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: os-service
  template:
    metadata:
      labels:
        app: os-service
    spec:
      # IRSA (EKS): a role vem da annotation do ServiceAccount. No AWS Academy (LabRole, sem IRSA),
      # as credenciais vêm da role do nó e a annotation é ignorada. Veja serviceaccount.yaml.
      serviceAccountName: os-service
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: os-service
          image: "IMAGE_PLACEHOLDER"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: JWT_SECRET
            - name: WEBHOOK_APROVACAO_SECRET
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: WEBHOOK_APROVACAO_SECRET
            - name: SPRING_FLYWAY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: os-service-config
                  key: SPRING_FLYWAY_ENABLED
            - name: SPRING_FLYWAY_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: os-service-config
                  key: SPRING_FLYWAY_SCHEMAS
            - name: SWAGGER_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: os-service-config
                  key: SWAGGER_BASE_PATH
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: os-service-config
                  key: AWS_REGION
            - name: OS_TOPICO_OS_EVENTS
              valueFrom:
                configMapKeyRef:
                  name: os-service-config
                  key: OS_TOPICO_OS_EVENTS
            - name: OS_TOPICO_BILLING_EVENTS
              valueFrom:
                configMapKeyRef:
                  name: os-service-config
                  key: OS_TOPICO_BILLING_EVENTS
            - name: OS_TOPICO_EXECUTION_EVENTS
              valueFrom:
                configMapKeyRef:
                  name: os-service-config
                  key: OS_TOPICO_EXECUTION_EVENTS
            - name: OS_FILA_BILLING
              valueFrom:
                configMapKeyRef:
                  name: os-service-config
                  key: OS_FILA_BILLING
            - name: OS_FILA_EXECUTION
              valueFrom:
                configMapKeyRef:
                  name: os-service-config
                  key: OS_FILA_EXECUTION
            - name: OS_SAGA_PAGAMENTO_MAX_TENTATIVAS
              valueFrom:
                configMapKeyRef:
                  name: os-service-config
                  key: OS_SAGA_PAGAMENTO_MAX_TENTATIVAS
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
